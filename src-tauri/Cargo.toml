[package]
name = "transmogrifier-desktop"
version = "1.0.1"
edition = "2024"
description = "Tauri shell: owns the window and exposes the compute core to the web UI."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
transmogrifier-desktop-core = { path = "../src-core" }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tokio-util = "0.7.20"
keyring = "4.2.0"
